[package]
name = "turingosd"
version = "0.1.0"
edition = "2021"
description = "TuringOS.app sovereign-host daemon: kernel emitting typed event streams over UDS. The app is not the truth; this daemon projects it."
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Read-only enumeration cross-check lane (A1_02). No network features: the
# daemon never fetches; vendored build keeps Linux CI and macOS dev identical.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
sha2 = "0.10"
# A1_03 UDS event subscription: async listener + broadcast fan-out. libc only
# for getuid (peer-cred same-uid policy); no other raw syscalls.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
libc = "0.2"
# A1_04 fs-watch spike: macOS -> FSEvents backend, Linux -> inotify.
# Watch events are HINTS only (R1_memo §2.f) - git remains the truth.
notify = "8"

[dev-dependencies]
tempfile = "3"

[lib]
name = "turingosd"
path = "src/lib.rs"

[[bin]]
name = "turingosd"
path = "src/main.rs"
