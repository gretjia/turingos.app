it_state_root_advance → sign+submit MarketSeedTx(provider=MarketMakerBudget, event_id, collateral=seed_micro) → await → sign+submit CpmmPoolTx(provider=MarketMakerBudget, event_id, seed_yes=seed_no=seed_micro as u128) → await → Created{event_id, pool_seed_micro}. event_id constructed via node_survive_event_id (architect amendment 1). Architect amendment 4: caller MUST invoke ONLY after WorkTx L4-accepted (no L4.E auto-pool). Architect amendment 3: all 3 sub-tx route via canonical Sequencer::submit_agent_tx admission — no emit_system_tx bypass; no hand-written treasury debit / pool reserve mutation. Best-effort contract: failures return typed NodeMarketEmitOutcome variant; Err reserved for EmitSystemError (currently unreachable since this helper does not touch emit_system_tx — kept for symmetry with sibling helpers). Predecessor TB-N3 A2 hash 2a2f3866 superseded.  # rehashed by TB-N3 A2 + A3 prep (2026-05-11; architect ruling 2026-05-11 amendments 1+3+Q5): added 3 NEW pub items — `InvestRouteError` enum (7 variants: ZeroAmount / NegativeAmount / AmountExceedsBalance / MalformedNode / UnknownEvent / PoolNotActive / KeypairError) with `to_no_trade_reason()` mapping into the §8.2 taxonomy + `public_summary()` for the trace.reason_summary_public bound; `tb_n3_invest_to_router_tx` (sync constructor; pre-classifies via optional snapshot then signs canonical BuyWithCoinRouterSigningPayload via AgentKeypairRegistry::sign; mirrors make_real_*_signed_by shape; min_out_shares = 0 per architect Q5 MVP; event_id constructed via node_survive_event_id per amendment 1); `make_real_cpmm_pool_signed_by` (sync; mirrors make_real_market_seed_signed_by shape; symmetric init; required by forthcoming A3 emit helper for canonical signing path per amendment 3 "A3 应优先用 MarketSeedTx ... 不得手写 treasury debit / pool reserve"). Predecessor TB-N2 B2 R2 hash 005e1efb superseded.  # rehashed by TB-N2 B2 R2 race fix (2026-05-11; Codex G2 R1 Q8 VETO closure): `tb_n2_emit_event_resolve_after_finalize` now accepts `verify_tx_id: &TxId` 3rd param and derives `claim_id = TxId(format!("claim-{verify_tx_id}"))` (mirrors tb8 helper's claim_id_inner at adapter.rs:622). Poll loop now requires BOTH `claims_t[claim_id].status == ClaimStatus::Finalized` AND `task_markets_t[task_id].state == Open` before emit. The claim Finalized witness signals FinalizeReward dispatch arm has applied (state_root advanced past R_0), so the subsequent `emit_system_tx` captures the post-FinalizeReward state_root → no StaleParent L4.E race. Prior R1 helper polled only task_markets_t (which is unchanged by FinalizeReward); smoke evidence `handover/evidence/stage_b3_smoke_b2_20260511T012401Z/deepseek-v4-flash/seed1/rep1/P002_aime_1983_p2/runtime_repo/rejections.jsonl:9` showed `tx_kind:EventResolve public_summary:stale_parent_root` — the B2 transition was rejected at apply time, leaving task_markets_t.state unchanged at Open and the CPMM lifecycle gap §3.3 not actually closed. R2 fix is binding-tested by `tests/constitution_n2_event_resolve.rs::sg_n2_b2_9_adapter_polls_claim_finalized_before_emit_r2`. Predecessor TB-N2 B2 R1 hash 18bc199e superseded.  # rehashed by TB-N2 B2 (2026-05-11): added `tb_n2_emit_event_resolve_after_finalize` poll-then-emit helper (mirrors `tb8_emit_finalize_after_verify` pattern). Polls `q_snapshot` until task_markets_t[task_id].state == Open; emits `SystemEmitCommand::EventResolve` via `Sequencer::emit_system_tx`. Best-effort contract: Ok(true) on emit / Ok(false) on poll-budget-expiry or task already resolved / Err on unexpected emit_system_tx error. Closes the CPMM lifecycle automation gap from the OMEGA-Confirm exit path. Predecessor hash 48da399a superseded.  # rehashed by TB-16.x.2.3 (2026-05-05; architect umbrella charter §2 Atom 2.3 — CompleteSetRedeem env-var trigger): ADDITIVE — added make_real_complete_set_redeem_signed_by(keypairs, parent_state_root, event_task, owner, outcome, share_units, suffix, timestamp_logical) helper. Mirrors make_real_complete_set_min