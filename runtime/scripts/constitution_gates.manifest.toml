m over the tape incl FAILED branches (the decisive 60-accepted+50-failed=110>=100 halt), same tape+ceiling ⇒ same verdict, cross-checked against the pure budget_check decision function. ZERO genesis-pinned-file edits: the mechanism lives in the UNPINNED src/runtime/budget_ceiling.rs (nested as a #[path] submodule of the UNPINNED src/runtime/agent_scheduler.rs, pin-count 0, reusing vpput_reconstruction C_i) + the UNPINNED src/memory_kernel.rs membrane (pin-count 0); the PINNED q_state.rs (BudgetSnapshot.cost_ceiling_microcoin read-only) / typed_tx.rs (RejectionClass::BudgetExceeded reused) / sequencer.rs / genesis_payload.toml are NOT in the diff."
