[[gate]]
name = "constitution_arg_taint_admission"
authority = "arg-taint sub-article: §8 token APPROVE-ARG-TAINT-ADMISSION-SUBARTICLE — value-level wtool-argument taint (ArgTaint Trusted/AgentGenerated/ToolOutput/UntrustedExternal + join propagation, src/predicate_admission/arg_taint.rs, nested as a #[path] submodule of the UNPINNED src/predicate_admission.rs) plus the admission HARD-GATE: a tainted (non-Trusted) argument value flowing into a privileged sink (economic-wallet/system-only/oracle/sandboxed/external-side-effect tool, or a wallet//system/ write-set namespace) is REJECTED by the shared admission contract via decide_admission_with_taint, routed from the UNPINNED memory-kernel leg (MemoryKernel::step_forward_with_taint) so the verified head does NOT advance (no Q_{t+1}); a Trusted-arg call is ADMITTED (non-vacuous positive control). ZERO genesis-pinned-file edits — the taint reject reuses the existing AcceptancePredicateFalse reason (no new AdmissionFailReason variant) so the pinned sequencer.rs exhaustive match stays valid, and the pinned sequencer adapter keeps calling the unchanged decide_admission."
added = "2026-06-07"

[[gate]]
name = "constitution_arg_taint_provenance_live"
authority = "arg-taint sub-article forward-wiring (LIVE-FC1 Phase 4): §8 token APPROVE-ARG-TAINT-ADMISSION-SUBARTICLE — the PRODUCTION MemoryKernel::step_forward entry-point now DERIVES real arg-taint findings from the proposal's on-tape raw_output (src/predicate_admission/arg_taint_provenance.rs::derive_wtool_call_from_proposal, nested as a #[path] submodule of the UNPINNED src/predicate_admission.rs), closing the prior empty-`&[]` gap at the UNPINNED src/memory_kernel.rs::step_forward_with_workspace. NO FALSE REJECT: an ordinary proposal (no wtool_call declaration) yields an empty WtoolCall → no findings → admits exactly as before; only a genuinely external/tool-provenance arg flowing into a privileged sink newly produces a finding. Deterministic + replay-stable (pure function of raw_output bytes; no RNG/wall-clock). ZERO genesis-pinned-file edits."
added = "2026-06-08"

