# - Gates may only be added via explicit architect directive
# 
# Authority: See RUN_CONSTITUTION_GATES_HISTORY.md for K-1.5 migration rationale
#
# NOTE: Gates marked with "extracted-from-original-runner" were part of the
# original 67-gate hard-coded array. Gates added after 2026-05-20 reference
# the directive that authorized them.


