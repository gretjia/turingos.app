[[gate]]
name = "constitution_boltzmann_selection_observe_only"
authority = "S3 Boltzmann observe-only selection trace — brings the dead-but-tested integer-rational scheduler boltzmann_select_parent_v2 ONLINE as a tape-anchored OBSERVE-ONLY selection record (src/runtime/boltzmann_selection_trace.rs, nested as a #[path] submodule of the UNPINNED src/runtime/agent_scheduler.rs). record_boltzmann_selection_over_econ runs the full live derivation chain compute_price_index → compute_mask_set → boltzmann_select_parent_v2 over a BORROWED &EconomicState and persists the recommendation to CAS via CasStore::put (ObjectType::Generic + free-form schema_id s3.boltzmann_selection_trace.v1, no pinned cas/schema.rs variant; the CAS commit IS the L4 anchor). 'Price is signal, not truth' (CR-14.1): a derived view, never canonical state, never an admission/predicate input. Triple-coupled gate: (1) RECONSTRUCTABLE — a realistic EconomicState with three DISTINCT-priced nodes (price_yes = long/(long+short)) round-trips from CAS (self-addressed Cid::from_content(stored)==trace_id; restore_*==read_*==in-memory; schema-id discoverable); (2) REPLAY-DETERMINISM / REAL-WIRING — the recorded selected_parent EQUALS a fresh independent boltzmann_select_parent_v2 call with the same inputs+seed (records the REAL function output, not a hand-set value; identical inputs+seed → identical trace_id across CAS instances); (3) NON-VACUOUS — epsilon_exploration_num=0 picks the genuine highest-price_yes node with selection_branch==ArgmaxExploit, AND an epsilon policy + firing seed makes selection_branch==EpsilonExploration reachable with a non-argmax pick; (4) OBSERVE-ONLY — econ is byte-identical before/after (no mutation, no head advance; recorder returns only a Cid) and writing the trace mints NO filesystem side-store (canonical store is CAS/tape, Art. 0.2); plus an inline mutation-sanity witness proving the gate is falsifiable. INTEGER MATH ONLY — every persisted numeric field is u64/i64/u128 (RationalPrice numerator/denominator cross-multiplication); the f64 boltzmann_softmax variant is deliberately not used. ZERO genesis-pinned-file edits — nested under the UNPINNED agent_scheduler.rs so the pinned runtime/mod.rs stays untouched."
added = "2026-06-08"

