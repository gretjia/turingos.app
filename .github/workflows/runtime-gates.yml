# runtime-gates.yml — Constitutional gates CI lane (A1_9_02)
#
# PURPOSE: The kernel's constitution travels with the kernel. This lane runs
# (a) the full 194-gate constitution suite, (b) the full cargo workspace with
# the baseline-exceptions ratchet, and (c) shipgate p1.9 (boundary grep +
# gate-count checksum + ratchet-format check) on every push touching runtime/.
# Plugs the v4-era CI blind spot: no workflow there ran cargo test --workspace
# (R1.9 §0.2).
#
# Matrix: ubuntu (GNU userland) + macos-26 (BSD userland — proves the POSIX
# gates-runner fix stays portable).

name: runtime-gates

on:
  push:
    paths:
      - "runtime/**"
      - "scripts/shipgate.sh"
      - "scripts/predicates/**"
      - "constitution/**"
  pull_request:
    paths:
      - "runtime/**"
      - "scripts/shipgate.sh"
      - "scripts/predicates/**"
      - "constitution/**"

jobs:
  runtime-gates:
    name: Constitution gates + workspace ratchet
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime

      - name: Runtime present (P1.9 guard)
        run: test -f runtime/Cargo.toml

      - name: Constitution gate suite (194 gates, ratchet-aware)
        run: bash scripts/predicates/check_constitution_gates.sh

      - name: Workspace tests + baseline ratchet
        run: bash scripts/predicates/check_runtime_workspace.sh

      - name: shipgate p1.9 boundary + gate-count + ratchet format
        # Full p1.9 includes the swift app lane (macOS-only, runs in app.yml);
        # here we run the three p1.9-specific gates standalone to keep this
        # lane focused on the kernel. Gates 17/18/19 logic is shared with the
        # local shipgate via the same script.
        run: |
          bash -c '
            set -u; FAIL=0
            hits=$(grep -rE "use turingosd?.*runtime|use runtime::" daemon/ app/ 2>/dev/null | grep -v "^[[:space:]]*#" || true)
            [ -z "$hits" ] && echo "[PASS] boundary grep" || { echo "[FAIL] boundary: $hits"; FAIL=1; }
            pins=$(python3 -c "import tomllib;print(tomllib.load(open(\"constitution/PINS.toml\",\"rb\"))[\"runtime_gates\"][\"gate_count\"])")
            files=$(ls runtime/tests/constitution_*.rs | wc -l | tr -d " ")
            man=$(sed -n "s/^name = \"\(.*\)\"$/\1/p" runtime/scripts/constitution_gates.manifest.toml | wc -l | tr -d " ")
            { [ "$pins" = "$files" ] && [ "$pins" = "$man" ]; } && echo "[PASS] gate count $files" || { echo "[FAIL] count PINS=$pins files=$files manifest=$man"; FAIL=1; }
            bad=$(grep -v "^[[:space:]]*#" scripts/predicates/baseline_exceptions.list | grep -v "^[[:space:]]*$" | grep -v "owned-by:" || true)
            [ -z "$bad" ] && echo "[PASS] ratchet format" || { echo "[FAIL] ratchet: $bad"; FAIL=1; }
            exit $FAIL
          '
