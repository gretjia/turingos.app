# Rust lane of repo law: daemon gates on Linux (primary dev lane) and
# macos-26 arm64 (platform truth lane - resolves R1 UNVERIFIED items).
name: rust
on:
  push:
    branches: ["**"]
    paths: ["daemon/**", "fixtures/**", "contracts/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["daemon/**", "fixtures/**", "contracts/**", ".github/workflows/rust.yml"]
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup component add clippy rustfmt 2>/dev/null || true
      - name: fmt
        run: cargo fmt --check
      - name: clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: test (incl. fixture contract conformance)
        run: cargo test
