  <text x="126" y="216" font-size="13"><tspan fill="#34C759">+12</tspan> <tspan fill="#FF3B30">−2</tspan> <tspan fill="#8E8E93">src/lib.rs</tspan></text>
  <rect x="36" y="252" width="340" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <text x="36" y="282" fill="#9a9aa2" font-size="12">sess_0001 · <tspan fill="#6cb8ff">manifest_registered</tspan></text>
  <text x="36" y="306" fill="#9a9aa2" font-size="12">候选提案 cand_0001 已就绪</text>
  <rect x="36" y="324" width="120" height="30" rx="9" fill="#0A84FF" fill-opacity="0.18" stroke="#0A84FF" stroke-opacity="0.45"/>
  <text x="96" y="344" fill="#6cb8ff" font-size="12" text-anchor="middle">事件流 (L0)</text>

  <!-- card 2: conflict (attention) -->
  <rect x="412" y="132" width="380" height="240" rx="20" fill="#FFCC00" fill-opacity="0.06" stroke="#FFCC00" stroke-opacity="0.5"/>
  <text x="436" y="172" fill="#ffd60a" font-size="15">⚠ 同分支双检出</text>
  <text x="436" y="198" fill="#e8e9ee" font-size="14">wt_hotfix ↔ wt_hotfix_2</text>
  <text x="436" y="220" fill="#8e8e96" font-size="12">⎇ hotfix/crash — git 默认禁止，--force 旁路造成</text>
  <text x="436" y="248" fill="#d4a900" font-size="12">两个 writer 互相覆写的风险。</text>
  <text x="436" y="268" fill="#d4a900" font-size="12">证据: worktree list --porcelain 分组命中 ≥2</text>
  <rect x="436" y="290" width="150" height="30" rx="9" fill="#FFCC00" fill-opacity="0.15" stroke="#FFCC00" stroke-opacity="0.5"/>
  <text x="511" y="310" fill="#ffd60a" font-size="12" text-anchor="middle">查看两侧 diff (L0)</text>
  <text x="436" y="348" fill="#6e6e76" font-size="11">只读：Radar 不替你解决，只让你看见</text>

