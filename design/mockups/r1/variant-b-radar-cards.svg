<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="-apple-system, 'SF Pro Text', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e13"/><stop offset="1" stop-color="#15151b"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.045"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#0A84FF" stop-opacity="0.35"/><stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1180" height="760" rx="26" fill="url(#bg2)"/>
  <rect width="1180" height="760" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="30" cy="28" r="7" fill="#FF5F57"/><circle cx="54" cy="28" r="7" fill="#FEBC2E"/><circle cx="78" cy="28" r="7" fill="#28C840"/>
  <text x="590" y="33" fill="#9a9aa2" font-size="13" text-anchor="middle">TuringOS — Worktree Radar</text>

  <!-- ============ VARIANT B: Radar Cards + 可见的 tape（ambient 优先） ============ -->
  <!-- top: ambient health band -->
  <rect x="16" y="52" width="1148" height="64" rx="18" fill="url(#glass2)"/>
  <circle cx="52" cy="84" r="10" fill="#FFCC00"/>
  <text x="74" y="90" fill="#e8e9ee" font-size="16">proj_demo — 1 项需要注意，其余健康</text>
  <text x="850" y="90" fill="#9a9aa2" font-size="13">对账 2s 前 ✓ · 演示数据=fixtures/p1</text>

