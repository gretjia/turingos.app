  <text x="832" y="222" fill="#6e6e76" font-size="11">未注册来源 — 对账发现，灰即"系统不背书"</text>

  <rect x="808" y="260" width="356" height="112" rx="20" fill="#ffffff" fill-opacity="0.02" stroke="#8E8E93" stroke-opacity="0.3" stroke-dasharray="5 5"/>
  <text x="832" y="296" fill="#9a9aa2" font-size="15">wt_old_spike</text>
  <text x="832" y="318" fill="#6e6e76" font-size="12">gitdir 死链 · prunable 孤儿</text>
  <rect x="1066" y="284" width="74" height="24" rx="12" fill="#8E8E93" fill-opacity="0.13" stroke="#8E8E93" stroke-opacity="0.4"/>
  <text x="1103" y="300" fill="#a8a8ae" font-size="11" text-anchor="middle">orphan</text>

  <!-- THE TAPE: visible evidence stream (Software 3.0: 证据流是一等界面元素) -->
