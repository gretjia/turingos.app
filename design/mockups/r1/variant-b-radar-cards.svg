  <text x="832" y="168" fill="#c9cad1" font-size="15">wt_main</text>
  <text x="832" y="190" fill="#8e8e96" font-size="12">⎇ main · clean · 外部创建</text>
  <rect x="1066" y="156" width="74" height="24" rx="12" fill="#8E8E93" fill-opacity="0.15" stroke="#8E8E93" stroke-opacity="0.4"/>
