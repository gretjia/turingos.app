  <g font-family="ui-monospace, 'SF Mono', monospace" font-size="12.5">
    <text x="40" y="474" fill="#636368">seq 7</text><circle cx="110" cy="470" r="4" fill="#8E8E93"/><text x="128" y="474" fill="#c9cad1">ReconciliationCompleted <tspan fill="#8e8e96">seen=2 drift=0 · git_worktree_list+fs</tspan></text>
    <text x="40" y="506" fill="#636368">seq 6</text><circle cx="110" cy="502" r="4" fill="#0A84FF"/><text x="128" y="506" fill="#c9cad1">ProposalCandidate <tspan fill="#8e8e96">cand_0001 · diff sha256:1f2e3d…</tspan></text>
    <text x="40" y="538" fill="#636368">seq 5</text><circle cx="110" cy="534" r="4" fill="#34C759"/><text x="128" y="538" fill="#c9cad1">DiffSnapshot <tspan fill="#8e8e96">+12/−2 · 1 file · source=git</tspan></text>
    <text x="40" y="570" fill="#636368">seq 4</text><circle cx="110" cy="566" r="4" fill="#0A84FF"/><text x="128" y="570" fill="#c9cad1">FileChanged <tspan fill="#8e8e96">src/lib.rs · hint_only（fsevents，待 git 确认）</tspan></text>
    <text x="40" y="602" fill="#636368">seq 3</text><circle cx="110" cy="598" r="4" fill="#0A84FF"/><text x="128" y="602" fill="#c9cad1">AgentSessionStarted <tspan fill="#8e8e96">agent_claude_01 · sess_0001</tspan></text>
    <text x="40" y="634" fill="#636368">seq 2</text><circle cx="110" cy="630" r="4" fill="#0A84FF"/><text x="128" y="634" fill="#c9cad1">WorktreeDiscovered <tspan fill="#8e8e96">wt_feature_x · created_by=agent_claude_01</tspan></text>
    <text x="40" y="666" fill="#636368">seq 1</text><circle cx="110" cy="662" r="4" fill="#8E8E93"/><text x="128" y="666" fill="#c9cad1">WorktreeDiscovered <tspan fill="#8e8e96">wt_main · source=git · observed_unsigned</tspan></text>
  </g>

  <!-- replay scrubber -->
  <rect x="40" y="692" width="1100" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="40" y="692" width="1100" height="6" rx="3" fill="#0A84FF" fill-opacity="0.35"/>
  <circle cx="1140" cy="695" r="9" fill="#0A84FF"/>
  <text x="40" y="726" fill="#636368" font-size="11">回放滑块 = Replay 时刻的种子（P6 全量实现）· 色点 = VISUAL_SEMANTICS 唯一徽章语义</text>
