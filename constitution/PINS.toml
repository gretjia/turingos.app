# PINS.toml — single source for pinned external truth.
# Rule (M7): every pinned fact carries `verified_on`. A verification result is
# itself perishable — re-verify before relying on anything older than the
# current phase's R-stage memo.

[constitution]
file = "constitution/constitution.md"
sha256 = "bbbe1ebd5f3372345d1f8911894e26b3f80cf0a45c353f2eb6251c006fae073a"
source = "verbatim user upload (1c451ed3, 1258 lines)"
verified_on = "2026-06-10"
tier = 1 # Tier-1 read-only: guarded by hook + shipgate; amendments only via Class-4 ratification upstream

[upstream.turingosv4]
repo = "https://github.com/gretjia/turingosv4"
role = "constitutional runtime: ChainTape/CAS/replay/sequencer/market/verifier"
rev = "UNPINNED" # pin at the first phase that consumes a runtime interface (P2 R-stage at latest); never consume unpinned
facts_verified_on = "2026-06-10" # README/AGENTS.md/Cargo.toml: bins-only (no lib target), ed25519-dalek v2, git2 0.20, no SQLite dep

[toolchain.dev_lane]
# Primary development SDK (user second ruling 2026-06-10): build with Xcode 27 SDK,
# deploy from macOS 26. 27-only API must be file-isolated behind #available so the
# project still compiles under the CI lane SDK (ADR-008).
xcode = "27.0 beta (27A5194q)"
sdk = "macOS 27 (Golden Gate)"
deployment_target = "macOS 26"
verified_on = "2026-06-10"

[toolchain.ci_lane]
# CI Swift lane: newest Xcode available on hosted runners; switch to 27 the moment
# runner images carry it (check actions/runner-images at each R-stage).
xcode = "26.5" # bundled Swift 6.3.2 (xcodereleases.com)
ci_runner = "macos-26" # arm64; proven green 2026-06-10 (rust lane, 24s)
verified_on = "2026-06-10"
ratified = "user rulings 2026-06-10 (UpdatePins L3: checkpoint + follow-up ruling)"

[toolchain.design_preview_lane]
# Exploration lane only: DESIGN.md research, Liquid Glass adaptation, snapshot prototypes.
# Never a release gate.
xcode = "27.0 beta (27A5194q)"
swift = "6.4"
sdk = "macOS 27 (Golden Gate)"
verified_on = "2026-06-10" # Apple developer releases feed + WWDC26 coverage
notes = "Golden Gate GM expected 2026-09; beta APIs drift until GM; Apple-Silicon-only"

[claude_code_facts]
# Corrected finding, see research/R0_memo.md §4 (an earlier check wrongly said these hooks don't exist).
worktree_hooks = "WorktreeCreate/WorktreeRemove EXIST"
hook_event_count = 31
verified_on = "2026-06-10"
source = "https://code.claude.com/docs/en/hooks"
